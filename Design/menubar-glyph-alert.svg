<?xml version="1.0" encoding="UTF-8"?>
<!--
  MergeCue menu bar template glyph, attention ("needs you") state.
  Identical to menubar-glyph.svg except the signal dot: filled and enlarged (r 2.1 disc instead of an
  r 1.85 outline ring), with a proportionally wider gap, so the state reads by shape alone in a monochrome
  template image. Rendered to PNG by scripts/menubar_glyph.py (see menubar-glyph.svg for the SVG subset).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <title>MergeCue menu bar glyph (attention)</title>
  <defs>
    <mask id="signal-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <rect x="0" y="0" width="18" height="18" fill="#ffffff"/>
      <circle cx="15.2" cy="2.8" r="3" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#signal-gap)" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path id="cue-loop" d="M2.75 3.75 L10 9.25 L2.75 14.75 Z"/>
    <path id="cue-stem" d="M10 9.25 L13.75 3.75 L13.75 14.75"/>
  </g>
  <circle id="signal-dot" cx="15.2" cy="2.8" r="2.1" fill="#000000"/>
</svg>
