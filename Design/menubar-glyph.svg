<?xml version="1.0" encoding="UTF-8"?>
<!--
  MergeCue menu bar template glyph, normal state.
  Echoes the app icon: the play-triangle loop of the folded "M" (forward cue), joined by a diagonal to the
  vertical bar, plus the signal dot nested in the top-right fold (here an outline ring; the alert variant
  fills and enlarges it). Monochrome template: only the shape/alpha matters, macOS tints it for the menu bar.
  Canvas 18 x 18 pt (1 user unit = 1 pt). Stroke 1.5 pt matches SF Symbols "regular" at menu bar size; the
  stems are centred on x.75 so their edges land on whole pixels in the @2x render.
  Rendered to PNG by scripts/menubar_glyph.py, which implements exactly the SVG subset used here
  (paths with M/L/H/V/Z, circles, rects, a luminance mask, round caps/joins). Edit geometry here, then run
  `python3 scripts/make-icons.py`.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <title>MergeCue menu bar glyph</title>
  <defs>
    <mask id="signal-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <rect x="0" y="0" width="18" height="18" fill="#ffffff"/>
      <circle cx="15.2" cy="2.8" r="2.75" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#signal-gap)" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path id="cue-loop" d="M2.75 3.75 L10 9.25 L2.75 14.75 Z"/>
    <path id="cue-stem" d="M10 9.25 L13.75 3.75 L13.75 14.75"/>
  </g>
  <circle id="signal-dot" cx="15.2" cy="2.8" r="1.35" fill="none" stroke="#000000" stroke-width="1"/>
</svg>
